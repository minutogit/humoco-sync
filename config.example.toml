# HuMoCo Sync Server — Example Configuration
# Copy to config.toml and customize for your deployment.
# Generate a template quickly via:
#   humoco-sync-server generate-config --mode hybrid --admin-pubkey <64-hex>

[server]
bind = "127.0.0.1:8080"
public_base_url = "https://sync.example.org"
data_dir = "humoco_sync_data"
db_path = "./data/humoco-sync.redb"
# Operator Ed25519 pubkey (64 lowercase hex chars). Required when enable_admin_app = true.
admin_pubkey = ""
# Optional HMAC/Token/Encryption pepper (>= 64 hex chars). Auto-generated & persisted in DB if omitted.
server_pepper_hex = ""
soft_warning_percent = 80
# Set to 1 if running behind a local TLS reverse proxy (Caddy/nginx) sending X-Forwarded-For
trusted_proxy_hops = 1

[mode]
# Hybrid Mode: run both (or toggle either)
enable_admin_app = true
admin_app_profile = "friends"
max_admin_members = 300
# Optional per-member quota override (MiB, minimum 10) for admin_app_profile (default: 25 MiB)
max_admin_user_storage_mb = 25

enable_public_registration = true
default_public_profile = "free"
# Allowed gates: "email", "code", "pow", "open"
registration_gates = ["email", "code"]
enable_builtin_ui = true
service_name = "HuMoCo Community Sync"
operator_contact = "ops@example.org"
register_path = "/register"

[storage]
# Hard global storage cap across all users and pools
max_total_storage_mb = 4096
# Isolated pool cap for profiles with is_free_pool = true (prevents free spam from starving friends/pro)
max_free_pool_mb = 1024
# Grace window before overdue paid accounts automatically downgrade to default_public_profile
downgrade_grace_days = 7

[media]
max_bytes = 524288          # 512 KiB per blob
max_user_count = 12
max_user_bytes = 3145728    # 3 MiB per user
max_channel_mb = 512        # Global Priority-3 media cap
ttl_days = 90

[security]
# Generate via: humoco-sync-server hash-token
admin_token_hash = ""
# Optional separate Bearer token hash for billing/voucher webhooks (/api/v1/admin/*)
api_bearer_token_hash = ""
pow_difficulty_bits = 20
max_registrations_per_ipv4_24_per_day = 10
max_registrations_per_ipv6_48_per_day = 10
ip_requests_per_minute = 120
pubkey_requests_per_minute = 60

[email]
enabled = false
# "log" (dev/test) | "sendmail" | "smtp"
transport = "log"
smtp_host = "mail.example.org"
smtp_port = 587
smtp_username = ""
smtp_password = ""
# "starttls" | "tls" | "plain"
smtp_tls_mode = "starttls"
from_address = "noreply@example.org"
from_name = "HuMoCo Sync"
token_ttl_minutes = 30
sendmail_path = "/usr/sbin/sendmail"

[profiles.free]
display_name = "Community Free"
max_total_bytes = 1572864
is_free_pool = true
# Zero-PII GDPR default: store ONLY HMAC-SHA256(email, pepper), never the email address
store_contact_email = false

[profiles.free.channels.card]
max_bytes = 524288
ttl_days = 90

[profiles.free.channels.wot]
max_bytes = 131072
ttl_days = 90

[profiles.free.channels.backup]
max_bytes = 524288
ttl_days = 180

[profiles.free.channels.post]
max_bytes = 131072
ttl_days = 30

[profiles.free.channels.media]
max_bytes = 524288
ttl_days = 60
max_user_count = 6
max_user_bytes = 1048576

[profiles.friends]
display_name = "Friends & Host Circle"
max_total_bytes = 20971520
is_free_pool = false
store_contact_email = false

[profiles.friends.channels.card]
max_bytes = 1048576
ttl_days = 0

[profiles.friends.channels.wot]
max_bytes = 262144
ttl_days = 0

[profiles.friends.channels.backup]
max_bytes = 4194304
ttl_days = 0

[profiles.friends.channels.post]
max_bytes = 262144
ttl_days = 90

[profiles.friends.channels.media]
max_bytes = 524288
ttl_days = 90
max_user_count = 16
max_user_bytes = 6291456

[profiles.pro]
display_name = "Supporter Pro"
max_total_bytes = 104857600
is_free_pool = false
# Optional encrypted contact email (XChaCha20-Poly1305) for paid renewal support
store_contact_email = true

[profiles.pro.channels.card]
max_bytes = 2097152
ttl_days = 365

[profiles.pro.channels.wot]
max_bytes = 524288
ttl_days = 365

[profiles.pro.channels.backup]
max_bytes = 16777216
ttl_days = 365

[profiles.pro.channels.post]
max_bytes = 524288
ttl_days = 180

[profiles.pro.channels.media]
max_bytes = 2097152
ttl_days = 365
max_user_count = 64
max_user_bytes = 52428800

[lock]
# Voucher-pinned Sync Lock collision registry channel (SPEC Section 6)
# Note: lock_sk/lock_pub are generated once in redb SERVER_META["lock_key"] — never configured here.
enabled = true
# Maximum accepted bucket retention quarter (year * 4 + (q - 1), 8159 = 2039-Q4)
max_retention_quarter = 8159
# Base leading-zero-bits PoW difficulty on POST ?lock (depth-progressive up to 24 bits)
pow_base_bits = 8
# Optional unauthenticated PoW admission for POST ?lock_ticket (in addition to member/registered/admin auth)
allow_pow_tickets = false
ticket_pow_bits = 16
# Maximum lock slot inodes before rejecting new genesis tickets (active buckets continue)
max_inodes = 50000
# Pre-proposal freeze expiration TTL in seconds (default 1800s = 30m)
pre_freeze_ttl_secs = 1800
# Proposal timelock window in seconds for authority vetoes (default 259200s = 72h)
proposal_timelock_secs = 259200
# Creator inactivity duration before guarantors may initiate rotation (default 2592000s = 30d)
creator_inactivity_secs = 2592000
