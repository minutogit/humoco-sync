[package]
name = "humoco-sync-server"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "High-performance Hybrid Rust Drop Server for HuMoCo (wire-compatible with humoco-sync PHP)"

[dependencies]
humoco-proto = { path = "../../humoco-proto" }
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["full"] }
redb = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
bytes = "1"
url = "2"
form_urlencoded = "1"
base64 = "0.22"
subtle = "2"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "1"
zeroize = { version = "1", features = ["derive"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tempfile = "3"
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
